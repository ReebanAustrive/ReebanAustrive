<svg width="700" height="180" viewBox="0 0 700 180" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Fira Code', monospace">
  <rect x="1" y="1" width="698" height="178" rx="12" fill="#1e1e2e" stroke="#313244" stroke-width="1.5"/>

  <text x="28" y="38" fill="#8AADF4" font-size="15" font-weight="700" letter-spacing="0.5">~/streak</text>
  <line x1="28" y1="52" x2="672" y2="52" stroke="#313244" stroke-width="1"/>

  <!-- total contributions -->
  <g text-anchor="middle">
    <text x="150" y="100" fill="#cdd6f4" font-size="34" font-weight="700">425</text>
    <text x="150" y="124" fill="#6c7086" font-size="12">total contributions</text>
    <text x="150" y="142" fill="#45475a" font-size="10">Aug 22, 2024 – present</text>
  </g>

  <!-- current streak, ring -->
  <g text-anchor="middle">
    <circle cx="350" cy="95" r="34" fill="none" stroke="#313244" stroke-width="4"/>
    <circle cx="350" cy="95" r="34" fill="none" stroke="#8AADF4" stroke-width="4"
            stroke-dasharray="26 214" stroke-linecap="round" transform="rotate(-90 350 95)"/>
    <text x="350" y="102" fill="#cdd6f4" font-size="22" font-weight="700">1</text>
    <text x="350" y="142" fill="#6c7086" font-size="12">current streak</text>
    <text x="350" y="158" fill="#45475a" font-size="10">Aug 26</text>
  </g>

  <!-- longest streak -->
  <g text-anchor="middle">
    <text x="550" y="100" fill="#cdd6f4" font-size="34" font-weight="700">5</text>
    <text x="550" y="124" fill="#6c7086" font-size="12">longest streak</text>
    <text x="550" y="142" fill="#45475a" font-size="10">Jan 27 – Jan 31, 2025</text>
  </g>
</svg>
